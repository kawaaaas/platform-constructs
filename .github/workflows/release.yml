# v* のタグを push すると、テストして CodeArtifact に公開する
name: release
on:
  push:
    tags: ['v*']
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-publish
          aws-region: ap-northeast-1
      # @acme スコープだけを CodeArtifact に向ける（他のパッケージは通常の npm から）
      - run: aws codeartifact login --tool npm --domain acme --repository platform --namespace acme
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish
